name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    env:
      # Algunas suites importan la cadena storageService→supabase, que lanza al importar
      # sin env (undoAparatosIntegration). El anon key es público por diseño.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historia completa para que `git diff origin/main...HEAD` funcione en PRs
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Tests relacionados solo con los archivos fuente modificados.
      # En PR: diff contra origin/main (merge-base). En push a main: contra HEAD~1
      # (si es el primer commit no hay base y se omiten).
      - name: Related tests
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            if git rev-parse -q --verify "HEAD~1" >/dev/null 2>&1; then
              DIFF=$(git diff --name-only HEAD~1 HEAD -- 'src/**')
            else
              echo "Primer commit en main: sin base para diff; se omiten los tests relacionados."
              DIFF=""
            fi
          else
            DIFF=$(git diff --name-only origin/main...HEAD -- 'src/**')
          fi
          CHANGED=$(printf '%s' "$DIFF" | grep -E '\.(ts|tsx)$' | grep -v '.test.' || true)
          if [ -n "$CHANGED" ]; then
            echo "Archivos fuente modificados:"
            echo "$CHANGED"
            # Sin comillas: cada archivo es un argumento aparte para vitest related
            npx vitest related --run $CHANGED
          else
            echo "Sin archivos .ts/.tsx modificados; se omiten los tests relacionados."
          fi

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Advisory de tamaños (sustituto informativo del guard de arquitectura): lista los
      # archivos >700 l. NO falla — si la lista crece ronda tras ronda, hay split pendiente.
      - name: Size report (advisory)
        run: node scripts/sizeReport.mjs

      # Deploy producción SOLO si TODO el CI salió verde: la integración Git de Vercel está
      # apagada (github.enabled false en vercel.json) — el CLI es el único camino a prod.
      - name: Deploy producción (solo CI verde)
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

  # E2E de caminos críticos (rutas públicas, pricing interactivo, login opcional).
  # Job SEPARADO: corre en PARALELO al job ci (sin needs) — no lo bloquea ni lo retrasa.
  # auth.spec salta solo si los secrets E2E_EMAIL/E2E_PASS no están configurados.
  e2e:
    name: E2E Playwright (chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium + librerías del sistema del runner (apt) para que el navegador arranque.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Las VITE_ son necesarias: la app lanza error al importar sin ellas (src/lib/supabase.ts).
      # VITE_SUSCRIPCIONES=true enciende el modo suscripciones para que /pricing muestre el
      # toggle y el selector que checkout-mock.spec ejercita (sin tocar la pasarela real).
      - name: Run E2E
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUSCRIPCIONES: 'true'
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
        run: npx playwright test

      # Reporte HTML (playwright-report/) solo cuando algo falló: evidencia para depurar.
      - name: Upload reporte Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
