# Config de despliegue de las edge functions (supabase CLI la lee en `supabase functions deploy`).
# El webhook de Paddle POSTea SIN Authorization header: con el default
# verify_jwt = true Supabase lo rechazaría. La función valida su propia firma
# HMAC (Paddle-Signature con PADDLE_WEBHOOK_SECRET) — ver supabase/functions/paddle-webhook.
[functions.paddle-webhook]
verify_jwt = false


# crear-checkout y verificar-pago las llama el CLIENTE con JWT → verify_jwt true
# (el default; explícito para que un cambio de plataforma no los rompa en silencio).
[functions.crear-checkout]
verify_jwt = true

[functions.verificar-pago]
verify_jwt = true

[functions.paddle-portal]
verify_jwt = true

# La llamada programada se autentica con un secreto dedicado.
[functions.subscription-emails]
verify_jwt = false
