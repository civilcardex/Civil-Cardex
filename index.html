    <!--
  CSP Notes:
  - vercel.json is the single source of truth for the CSP; the meta tag below is kept in sync
    with it manually (frame-ancestors is included for documentation but is a no-op via meta —
    browsers only honor frame-ancestors from the HTTP header, which vercel.json sets).
  - frame-ancestors directive must be set as HTTP header (nginx/Cloudflare/Netlify/Vercel)
  - Strict-Transport-Security (HSTS) must be set as HTTP header (see vercel.json)
  - X-Frame-Options: DENY is set as an HTTP header in vercel.json; browsers ignore it via meta tag.

  Additional CSP rationale:
  - script-src NO lleva 'unsafe-inline': los scripts de arranque (fixer de canonical/og:url y
    texto de la pantalla de carga) viven en /scripts/*.js (un archivo propio: 'self' los cubre).
    Con 'unsafe-inline' la directiva no restringe NADA.
  - 'wasm-unsafe-eval' (no 'unsafe-eval'): pdfjs-dist compila WebAssembly para algunos
    decodificadores de imagen. pdf.js solo usa `new Function` como TEST de disponibilidad
    (isEvalSupported) y degrada solo si eval no existe -> no necesita 'unsafe-eval'.
  - En DESARROLLO el server de Vite inyecta scripts inline (HMR / React Refresh): la CSP la
    relaja vite.config.js (transformIndexHtml), no el index.html de producción.
  - va.vercel-scripts.com: scripts de Vercel Analytics/Speed Insights (cargan desde ahí también en producción)
  - frame-ancestors NO va aquí: los navegadores lo ignoran en <meta>; lo aplica el header HTTP de vercel.json
  - SRI (integrity) on Google Fonts not feasible — URLs are dynamically generated. crossorigin="anonymous" is set instead.
-->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://va.vercel-scripts.com; worker-src 'self' blob:; frame-src 'self' blob: https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'self' blob:; base-uri 'self'; form-action 'self';">

    <!-- JSON-LD Structured Data: FAQPage (preguntas reales del dominio — lo que la IA cita) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Cuál es la diferencia entre UC (Unidades de Consumo) y UD (Unidades de Desagüe)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "UC (Unidades de Consumo) mide la carga de aparatos en redes de agua fría y caliente según el método Hunter de probabilidad de uso simultáneo. UD (Unidades de Desagüe) mide la carga de aparatos en redes sanitarias de gravedad. Civil Cardex calcula ambas automáticamente por tramo y las propaga por la red."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se aplica el método Hunter en el diseño de redes hidrosanitarias?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El método Hunter estima el caudal probable de diseño sumando las Unidades de Consumo del tramo y aplicando un coeficiente K de simultaneidad según el número de descargas (K = 1/√(n−1) para n>1). Civil Cardex acumula las UC de cada tramo aguas abajo y calcula el caudal probable con el cambio de fórmula a partir de 240 UC, como exige la práctica para edificios de media y alta demanda."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es la fuerza tractiva mínima en redes sanitarias?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La fuerza tractiva es la tensión que el flujo ejerce sobre el fondo de la tubería y determina su capacidad de autolimpieza. Las normas exigen un mínimo (típicamente 1.0-1.5 Pa según la norma aplicable) para que los sólidos no sedimenten. Civil Cardex verifica fuerza tractiva en cada tramo de sanitaria y lluvias junto con velocidad y relación de llenado y/D."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué exige la norma NTC 1500 para el diseño de instalaciones hidrosanitarias?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La NTC 1500 (actualizada con NTC 1500-2) regula instalaciones de suministro de agua y drenaje en edificios: diámetros mínimos por aparato, velocidades y presiones máximas, ventilación y el uso del método Hunter para caudales de diseño. Civil Cardex aplica sus criterios automáticamente al verificar cada tramo dibujado."
          }
        }
      ]
    }
    </script>
