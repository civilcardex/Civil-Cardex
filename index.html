    <!--
  CSP Notes:
  - vercel.json is the single source of truth for the CSP; the meta tag below is kept in sync
    with it manually (frame-ancestors is included for documentation but is a no-op via meta —
    browsers only honor frame-ancestors from the HTTP header, which vercel.json sets).
  - frame-ancestors directive must be set as HTTP header (nginx/Cloudflare/Netlify/Vercel)
  - Strict-Transport-Security (HSTS) must be set as HTTP header (see vercel.json)
  - X-Frame-Options: DENY is set as an HTTP header in vercel.json; browsers ignore it via meta tag.

  Additional CSP rationale:
  - unsafe-inline required for Vite HMR in dev mode, and for the inline canonical/og:url script below in production
  - unsafe-eval required by pdfjs-dist internal parser (the worker itself is self-hosted at /pdfjs/pdf.worker.min.mjs, not CDN-loaded)
  - SRI (integrity) on Google Fonts not feasible — URLs are dynamically generated. crossorigin="anonymous" is set instead.
-->
